name: Mostrar fecha y hora 010 - Dato1

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  mostrar-fecha-hora:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar la fecha del día
        run: date
      - name: Mostrar la hora actual
        run: date +"%H:%M:%S"
      - name: Calcular día juliano
        id: julian_day
        shell: bash
        run: |
          echo "Día juliano del año: $(date +%j)"
          JD=$(python - <<'PY'
          import datetime
          now = datetime.datetime.utcnow()
          jd = now.toordinal() + 1721424 + 1
          print(jd)
          PY
          )
          echo "julian_day=$JD" >> "$GITHUB_OUTPUT"
          echo "Julian Day Number (JD): $JD"
      - name: Mostrar día de la semana
        run: date +"%A"
      - name: Mostrar mensaje de confirmación
        run: echo "El workflow se ejecutó correctamente"
